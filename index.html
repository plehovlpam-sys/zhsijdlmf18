<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>Mara</title>
    <style>
        :root {
            color-scheme: light;
            --phone-width: 320px;
            --phone-height: 568px;
            --iphone4s-width: 376px;
            --iphone4s-height: 739px;
            --iphone4s-scale: 1;
            --ios-font: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            background:
                radial-gradient(circle at 50% 18%, rgba(255, 255, 255, 0.16), transparent 28rem),
                linear-gradient(180deg, #15181b 0%, #0c0e10 100%);
            font-family: var(--ios-font);
            overflow: hidden;
        }

        .site-shell {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        .iphone4s-frame {
            position: absolute;
            left: 50%;
            top: 50%;
            width: var(--iphone4s-width);
            height: var(--iphone4s-height);
            overflow: visible;
            transform: translate(-50%, -50%) scale(var(--iphone4s-scale));
            transform-origin: center center;
        }

        @media (max-width: 392px),
        (max-height: 772px) {
            :root {
                --iphone4s-scale: 0.9;
            }
        }

        @media (max-width: 360px),
        (max-height: 690px) {
            :root {
                --iphone4s-scale: 0.84;
            }
        }

        @media (max-width: 330px),
        (max-height: 610px) {
            :root {
                --iphone4s-scale: 0.74;
            }
        }

        @media (max-width: 290px),
        (max-height: 540px) {
            :root {
                --iphone4s-scale: 0.65;
            }
        }

        .iphone4s-frame *,
        .iphone4s-frame *::before,
        .iphone4s-frame *::after {
            box-sizing: border-box;
        }

        .iphone4s-frame__rim {
            position: absolute;
            inset: -0.8%;
            pointer-events: none;
            border-radius: 18% / 9.2%;
            background:
                linear-gradient(180deg, transparent 0%, transparent 60%, rgba(0, 0, 0, 0.3) 82%, rgba(0, 0, 0, 0.64) 100%),
                linear-gradient(90deg, #747a82 0%, #eef1f4 5%, #9aa1aa 10%, #20242a 17%, #0b0c0f 50%, #20242a 83%, #9aa1aa 90%, #eef1f4 95%, #747a82 100%);
            box-shadow: 0 28px 62px rgba(0, 0, 0, 0.28);
        }

        .iphone4s-frame__glass-edge {
            position: absolute;
            inset: -0.27%;
            pointer-events: none;
            border-radius: 17.4% / 8.9%;
            background:
                linear-gradient(180deg, transparent 0%, transparent 66%, rgba(0, 0, 0, 0.26) 84%, rgba(0, 0, 0, 0.58) 100%),
                linear-gradient(145deg, rgba(255, 255, 255, 0.36), rgba(255, 255, 255, 0.055) 15%, rgba(0, 0, 0, 0.54) 50%, rgba(0, 0, 0, 0.12) 100%);
        }

        .iphone4s-frame__antenna {
            position: absolute;
            z-index: 5;
            pointer-events: none;
            border-radius: 999px;
            background: #111318;
        }

        .iphone4s-frame__antenna--top-left {
            left: 21.02%;
            top: -0.41%;
            width: 0.54%;
            height: 0.82%;
        }

        .iphone4s-frame__antenna--left-bottom {
            left: -0.81%;
            bottom: 12.6%;
            width: 1.35%;
            height: 0.27%;
        }

        .iphone4s-frame__antenna--right-bottom {
            right: -0.81%;
            bottom: 12.6%;
            width: 1.35%;
            height: 0.27%;
        }

        .iphone4s-frame__power {
            position: absolute;
            z-index: 4;
            top: -0.82%;
            right: 18.6%;
            width: 14.56%;
            height: 0.41%;
            pointer-events: none;
            background: linear-gradient(90deg, #8f959d, #4d535b, #15181d);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), 0 -1px 1px rgba(0, 0, 0, 0.18);
        }

        .iphone4s-frame__volume {
            position: absolute;
            z-index: 4;
            left: -1.62%;
            width: 1.35%;
            height: 3.84%;
            pointer-events: none;
            background: linear-gradient(180deg, #161a1f 0%, #5e6871 12%, #d8dde1 28%, #f7f8f9 46%, #8f98a1 62%, #38414a 80%, #101318 100%);
            box-shadow: -1px 0 1px rgba(0, 0, 0, 0.18), inset 1px 0 0 rgba(255, 255, 255, 0.38), inset -1px 0 1px rgba(0, 0, 0, 0.56);
        }

        .iphone4s-frame__volume--up {
            top: 19.73%;
        }

        .iphone4s-frame__volume--down {
            top: 28.36%;
        }

        .iphone4s-frame__body {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            border: 1px solid #1c1d22;
            border-radius: 16.9% / 8.6%;
            background:
                radial-gradient(circle at 50% 18%, rgba(255, 255, 255, 0.08), transparent 30%),
                linear-gradient(115deg, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0.04) 18%, rgba(0, 0, 0, 0) 34%),
                linear-gradient(180deg, #0f1014 0%, #030304 44%, #090a0d 100%);
            box-shadow:
                inset 0 0 0 2px rgba(255, 255, 255, 0.08),
                inset 0 0 0 5px rgba(0, 0, 0, 0.82),
                inset 0 18px 28px rgba(255, 255, 255, 0.06),
                0 20px 48px rgba(0, 0, 0, 0.38);
        }

        .iphone4s-frame__inner-edge {
            position: absolute;
            inset: 2.43%;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14.7% / 7.5%;
            box-shadow: inset 0 0 28px rgba(255, 255, 255, 0.04), inset 0 -26px 32px rgba(0, 0, 0, 0.52);
        }

        .iphone4s-frame__front-gloss {
            position: absolute;
            left: 18%;
            top: 8.49%;
            width: 11.32%;
            height: 34.25%;
            pointer-events: none;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.1);
            filter: blur(18px);
            transform: rotate(-18deg);
        }

        .iphone4s-frame__camera {
            position: absolute;
            left: 34.2%;
            top: 7.8%;
            width: 4.31%;
            aspect-ratio: 1;
            pointer-events: none;
            border-radius: 999px;
            background: #020204;
            box-shadow: inset 0 3px 5px rgba(0, 0, 0, 1), inset 0 -1px 1px rgba(255, 255, 255, 0.035);
        }

        .iphone4s-frame__camera-lens {
            position: absolute;
            inset: 18.75%;
            border-radius: inherit;
            background: radial-gradient(circle at 45% 42%, rgba(72, 96, 150, 0.82) 0 18%, rgba(14, 27, 66, 0.98) 43%, rgba(2, 4, 10, 1) 76%, #000 100%);
            box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.08), inset 0 -2px 3px rgba(0, 0, 0, 0.94);
        }

        .iphone4s-frame__camera-dot {
            position: absolute;
            left: 37.5%;
            top: 31.25%;
            width: 12.5%;
            aspect-ratio: 1;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.18);
            filter: blur(0.35px);
        }

        .iphone4s-frame__camera-shadow {
            position: absolute;
            left: 18.75%;
            top: 12.5%;
            width: 56.25%;
            height: 18.75%;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.55);
            filter: blur(0.8px);
        }

        .iphone4s-frame__speaker {
            position: absolute;
            left: 50%;
            top: 7.8%;
            width: 21.02%;
            height: 2.19%;
            pointer-events: none;
            border-radius: 999px;
            background: #020203;
            transform: translateX(-50%);
            box-shadow:
                inset 0 4px 5px rgba(0, 0, 0, 0.98),
                inset 0 -1px 1px rgba(255, 255, 255, 0.05),
                0 0 0 1px rgba(255, 255, 255, 0.03),
                1px 1px 1px rgba(0, 0, 0, 0.72);
        }

        .iphone4s-frame__speaker-glow {
            position: absolute;
            left: 7.7%;
            bottom: 18.75%;
            width: 30.8%;
            height: 37.5%;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.24);
            filter: blur(1.4px);
            opacity: 0.7;
        }

        .iphone4s-frame__speaker-metal {
            position: absolute;
            left: 11.5%;
            right: 12.8%;
            bottom: 25%;
            height: 37.5%;
            border-radius: 999px;
            background: linear-gradient(90deg, #c0c5c8 0%, #7b8389 30%, #343a40 76%, #08090a 100%);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.38), inset 0 -1px 1px rgba(0, 0, 0, 0.92);
        }

        .iphone4s-frame__speaker-highlight {
            position: absolute;
            left: 20.5%;
            right: 30.8%;
            bottom: 50%;
            height: 1px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.26);
        }

        .iphone4s-frame__speaker-shadow {
            position: absolute;
            left: 15.4%;
            right: 10.3%;
            top: 18.75%;
            height: 18.75%;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.88);
            filter: blur(0.3px);
        }

        .iphone4s-frame__home {
            position: absolute;
            left: 50%;
            bottom: 3.7%;
            width: 18.33%;
            aspect-ratio: 1;
            padding: 0;
            overflow: hidden;
            cursor: pointer;
            border: 0;
            border-radius: 999px;
            background: radial-gradient(circle at 64% 50%, #111318 0%, #050506 48%, #010101 100%);
            transform: translateX(-50%);
            transition: transform 100ms ease, box-shadow 100ms ease;
            box-shadow: inset 0 2px 3px rgba(255, 255, 255, 0.06), inset 0 -5px 9px rgba(0, 0, 0, 0.95), 0 3px 6px rgba(0, 0, 0, 0.72);
        }

        .iphone4s-frame__home:active {
            transform: translateX(-50%) translateY(1px);
            box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.035), inset 0 -8px 12px rgba(0, 0, 0, 1), 0 2px 4px rgba(0, 0, 0, 0.68);
        }

        .iphone4s-frame__home-glow {
            position: absolute;
            left: 0;
            top: 0;
            width: 51.5%;
            height: 100%;
            pointer-events: none;
            border-radius: 999px 0 0 999px;
            background: linear-gradient(90deg, rgba(202, 210, 214, 0.5) 0%, rgba(137, 146, 151, 0.42) 30%, rgba(62, 68, 72, 0.22) 62%, rgba(0, 0, 0, 0) 100%);
            transition: opacity 100ms ease;
        }

        .iphone4s-frame__home:active .iphone4s-frame__home-glow {
            opacity: 0.55;
        }

        .iphone4s-frame__home-inner-glow {
            position: absolute;
            left: 32.35%;
            top: 11.76%;
            width: 23.53%;
            height: 76.47%;
            pointer-events: none;
            border-radius: 999px;
            background: radial-gradient(circle at 0% 50%, rgba(180, 188, 192, 0.32) 0%, rgba(82, 89, 94, 0.16) 46%, rgba(0, 0, 0, 0) 78%);
            filter: blur(3px);
            transition: opacity 100ms ease;
        }

        .iphone4s-frame__home:active .iphone4s-frame__home-inner-glow {
            opacity: 0.45;
        }

        .iphone4s-frame__home-divider {
            position: absolute;
            left: 48.53%;
            top: 0;
            width: 1px;
            height: 100%;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.45);
        }

        .iphone4s-frame__home-square {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 32.35%;
            aspect-ratio: 1;
            pointer-events: none;
            border: 2px solid rgba(255, 255, 255, 0.58);
            border-radius: 27%;
            transform: translate(-50%, -50%);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1), 0 1px 2px rgba(0, 0, 0, 0.65);
        }

        .iphone4s-frame__screen {
            position: absolute;
            left: 7.45%;
            right: 7.45%;
            top: 17.7%;
            aspect-ratio: 2 / 3;
        }

        .iphone4s-frame__screen-inner {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            color: #fff;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.16), 0 0 0 4px rgba(0, 0, 0, 0.92), 0 8px 14px rgba(0, 0, 0, 0.62);
        }

        /* СТАТУС БАР */
        .status-bar {
            position: absolute;
            z-index: 10;
            top: 0;
            left: 0;
            right: 0;
            height: 20px;
            background: rgba(0, 0, 0, 0.92);
            color: rgba(255, 255, 255, 0.82);
            font-size: 13px;
            font-weight: 700;
            line-height: 20px;
            text-shadow: 0 -0.5px 0.5px rgba(0, 0, 0, 0.4);
            pointer-events: none;
        }

        .status-left {
            position: absolute;
            left: 4px;
            top: 0;
            height: 20px;
            width: 114px;
        }

        .status-right {
            position: absolute;
            right: 4px;
            top: 0;
            height: 20px;
            width: 61px;
        }

        .carrier {
            display: block;
            position: absolute;
            left: 24px;
            top: 0;
            width: 68px;
            height: 20px;
            line-height: 20px;
            overflow: visible;
            white-space: nowrap;
        }

        .clock {
            display: block;
            position: absolute;
            left: 123px;
            top: 0;
            width: 78px;
            height: 20px;
            text-align: center;
            font: inherit;
            line-height: 20px;
            color: inherit;
            white-space: nowrap;
            overflow: visible;
        }

        .cell-bars {
            position: absolute;
            left: 0;
            top: 0;
            width: 19px;
            height: 20px;
            display: block;
            opacity: 0.95;
            filter: drop-shadow(0 -0.5px 0.25px rgba(0, 0, 0, 0.4));
        }

        .cell-bars i {
            position: absolute;
            bottom: 5.5px;
            width: 3px;
            background: #fff;
        }

        .cell-bars i:nth-child(1) {
            left: 0;
            height: 4px;
        }
        .cell-bars i:nth-child(2) {
            left: 4px;
            height: 5px;
        }
        .cell-bars i:nth-child(3) {
            left: 8px;
            height: 6.5px;
        }
        .cell-bars i:nth-child(4) {
            left: 12px;
            height: 8px;
        }
        .cell-bars i:nth-child(5) {
            left: 16px;
            height: 10px;
        }

        .battery-percent {
            position: absolute;
            left: 0;
            top: 0;
            width: 35px;
            height: 20px;
            font-size: 13px;
            line-height: 20px;
        }

        .battery {
            position: absolute;
            left: 38px;
            top: 0;
            width: 21px;
            height: 20px;
            opacity: 0.95;
            filter: drop-shadow(0 -0.5px 0 rgba(0, 0, 0, 0.45));
        }

        .battery svg {
            display: block;
            width: 21px;
            height: 20px;
            overflow: visible;
            shape-rendering: crispEdges;
        }

        .battery-shell {
            fill: none;
            stroke: rgba(255, 255, 255, 0.95);
            stroke-width: 1;
        }

        .battery-nub,
        .battery-fill {
            fill: rgba(255, 255, 255, 0.95);
        }

        /* ===== КОНТЕНТ ===== */
        .iphone {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            display: flex;
            flex-direction: column;
        }

        .wallpaper {
            position: absolute;
            inset: 0;
            background: #000;
            z-index: 0;
        }

        .bottom-shadow {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 220px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.8));
            z-index: 1;
            pointer-events: none;
        }

        /* Скроллируемый контент */
        .content-scroll {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            bottom: 0;
            overflow-y: auto;
            overflow-x: hidden;
            z-index: 2;
            padding: 0 12px 20px;
            display: flex;
            flex-direction: column;
            gap: 0;
            scroll-behavior: smooth;
        }

        .content-scroll::-webkit-scrollbar {
            display: none;
        }

        /* SVG блок - растягивается на всю высоту экрана */
        .svg-wrap {
            width: 100%;
            height: 100%;
            min-height: 200px;
            position: relative;
            flex-shrink: 0;
            transition: height 0.05s linear;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            overflow: hidden;
            background: transparent;
            margin-top: 0;
            flex: 1;
        }

        .svg-wrap object,
        .svg-wrap svg {
            width: 100%;
            height: 100%;
            display: block;
            background: transparent;
            object-fit: contain;
        }

        .scroll-down {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            color: #888;
            font-size: 28px;
            pointer-events: none;
            font-family: 'Times New Roman', Times, serif;
            line-height: 1;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
            z-index: 5;
        }

        /* Картинки */
        .images-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 6px 0;
            gap: 12px;
            background: transparent;
            flex-shrink: 0;
        }

        .images-section img {
            width: 100%;
            max-width: 100%;
            height: auto;
            display: block;
            border: none;
            background: transparent;
            border-radius: 2px;
        }

        /* Кнопки */
        .buttons-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 12px 0 8px;
            background: transparent;
            flex-shrink: 0;
        }

        .buttons-section button {
            font-family: 'Times New Roman', Times, serif;
            font-size: 14px;
            background: white;
            color: black;
            border: 1px solid #aaa;
            padding: 4px 24px;
            width: fit-content;
            min-width: 100px;
            cursor: pointer;
            text-transform: lowercase;
            letter-spacing: 0.3px;
            transition: 0.1s linear;
        }

        .buttons-section button:active {
            transform: translate(1px, 1px);
        }

        /* gh.png */
        .gh-image {
            width: 100%;
            display: block;
            background: transparent;
            margin: 0;
            padding: 0;
            line-height: 0;
            flex-shrink: 0;
        }

        .gh-image img {
            width: 100%;
            height: auto;
            display: block;
            border: none;
            margin: 0;
            padding: 0;
        }

        /* Затемнение снизу */
        .screen-gradient {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.7));
            z-index: 3;
            pointer-events: none;
        }

        .iphone4s-frame__home {
            z-index: 20;
        }
    </style>
</head>
<body>
    <main class="site-shell">
        <section class="iphone4s-frame">
            <div class="iphone4s-frame__rim" aria-hidden="true"></div>
            <div class="iphone4s-frame__glass-edge" aria-hidden="true"></div>
            <div class="iphone4s-frame__antenna iphone4s-frame__antenna--top-left" aria-hidden="true"></div>
            <div class="iphone4s-frame__antenna iphone4s-frame__antenna--left-bottom" aria-hidden="true"></div>
            <div class="iphone4s-frame__antenna iphone4s-frame__antenna--right-bottom" aria-hidden="true"></div>
            <div class="iphone4s-frame__power" aria-hidden="true"></div>
            <div class="iphone4s-frame__volume iphone4s-frame__volume--up" aria-hidden="true"></div>
            <div class="iphone4s-frame__volume iphone4s-frame__volume--down" aria-hidden="true"></div>

            <div class="iphone4s-frame__body">
                <div class="iphone4s-frame__inner-edge" aria-hidden="true"></div>
                <div class="iphone4s-frame__front-gloss" aria-hidden="true"></div>

                <div class="iphone4s-frame__camera" aria-hidden="true">
                    <span class="iphone4s-frame__camera-lens"></span>
                    <span class="iphone4s-frame__camera-dot"></span>
                    <span class="iphone4s-frame__camera-shadow"></span>
                </div>

                <div class="iphone4s-frame__speaker" aria-hidden="true">
                    <span class="iphone4s-frame__speaker-glow"></span>
                    <span class="iphone4s-frame__speaker-metal"></span>
                    <span class="iphone4s-frame__speaker-highlight"></span>
                    <span class="iphone4s-frame__speaker-shadow"></span>
                </div>

                <button class="iphone4s-frame__home" type="button" aria-label="Home">
                    <span class="iphone4s-frame__home-glow"></span>
                    <span class="iphone4s-frame__home-inner-glow"></span>
                    <span class="iphone4s-frame__home-divider"></span>
                    <span class="iphone4s-frame__home-square"></span>
                </button>

                <div class="iphone4s-frame__screen">
                    <div class="iphone4s-frame__screen-inner">
                        <div class="iphone">
                            <!-- Статус бар -->
                            <header class="status-bar">
                                <div class="status-left">
                                    <span class="cell-bars">
                                        <i></i><i></i><i></i><i></i><i></i>
                                    </span>
                                    <span class="carrier">Mara</span>
                                </div>
                                <time class="clock" id="clock">00:00</time>
                                <div class="status-right">
                                    <span class="battery-percent">100%</span>
                                    <span class="battery">
                                        <svg viewBox="0 0 21 20">
                                            <path class="battery-shell" d="M0.5 4.5H18.5V14.5H0.5Z" />
                                            <path class="battery-nub" d="M19 8H21V11H19Z" />
                                            <path class="battery-fill" d="M2 6.5H17V12.5H2Z" />
                                        </svg>
                                    </span>
                                </div>
                            </header>

                            <div class="wallpaper"></div>
                            <div class="bottom-shadow"></div>

                            <!-- КОНТЕНТ -->
                            <div class="content-scroll" id="contentScroll">
                                <!-- SVG - растягивается на всю высоту -->
                                <div class="svg-wrap" id="svgWrap">
                                    <object data="mara.svg" type="image/svg+xml"></object>
                                    <div class="scroll-down">▼</div>
                                </div>

                                <div class="images-section">
                                    <img src="1.png" alt="">
                                    <img src="2.png" alt="">
                                    <img src="3.png" alt="">
                                </div>

                                <div class="buttons-section">
                                    <button>кнопка1</button>
                                    <button>кнопка2</button>
                                    <button>кнопка3</button>
                                </div>

                                <div class="gh-image">
                                    <img src="gh.png" alt="">
                                </div>
                            </div>

                            <div class="screen-gradient"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        (function() {
            // === ЧАСЫ 24-часовой формат ===
            function updateClock() {
                const clock = document.getElementById('clock');
                if (!clock) return;
                const now = new Date();
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                clock.textContent = hours + ':' + minutes;
            }
            updateClock();
            setInterval(updateClock, 1000);

            // === СЖАТИЕ SVG ПРИ СКРОЛЛЕ ===
            const wrap = document.getElementById('svgWrap');
            const scrollContainer = document.getElementById('contentScroll');
            if (!wrap || !scrollContainer) return;

            let maxHeight = 0;
            const minHeight = 60;

            function setMaxHeight() {
                // Высчитываем высоту контейнера минус статус бар и отступы
                const screenHeight = scrollContainer.clientHeight || 400;
                maxHeight = screenHeight - 10; // оставляем место для иконки вниз
                maxHeight = Math.max(maxHeight, 200);
                wrap.style.height = maxHeight + 'px';
                const obj = wrap.querySelector('object');
                if (obj) obj.style.height = maxHeight + 'px';
                updateHeight();
            }

            function updateHeight() {
                const scrollY = scrollContainer.scrollTop;
                let newH = maxHeight - scrollY * 0.9;
                if (newH < minHeight) newH = minHeight;
                if (newH > maxHeight) newH = maxHeight;
                wrap.style.height = newH + 'px';
                const obj = wrap.querySelector('object');
                if (obj) obj.style.height = newH + 'px';
            }

            let ticking = false;
            scrollContainer.addEventListener('scroll', function() {
                if (!ticking) {
                    window.requestAnimationFrame(function() {
                        updateHeight();
                        ticking = false;
                    });
                    ticking = true;
                }
            });

            window.addEventListener('resize', function() {
                setTimeout(setMaxHeight, 100);
            });

            window.addEventListener('orientationchange', function() {
                setTimeout(setMaxHeight, 300);
            });

            setTimeout(setMaxHeight, 150);
        })();
    </script>
</body>
</html>
