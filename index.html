<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>iOS Nav Bar — Широкий индикатор</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&display=swap" rel="stylesheet">
  <style>
    /* ================================================================
       ПОЛНАЯ КОПИЯ СТИЛЕЙ ИЗ ОРИГИНАЛЬНОГО КОДА
       ================================================================ */
    :root[data-platform="ios"][data-theme="light"] {
      --button-confirm-color: #2fb250;
      --button-destructive-color: #ff3b3019;
      --button-main-disabled-color: #e8e8e9;
      --highlight-default: #8e8e923d;
      --primary-fill-background: #74748033;
      --quaternary-fill-background: #74748014;
      --quick-menu-background: #ffffff8c;
      --quick-menu-foreground: #000;
      --secondary-accent-color: #007aff19;
      --secondary-fill-background: #74748028;
      --segmented-control-active-background: #fff;
      --separator-color: #c8c7cb;
      --separator-non-opaque: #3c3c435b;
      --tertiary-fill-background: #7474801e;
      --text-confirm-color: #2fb250;
      --text-destructive-color: #ff3b30;
      --text-main-disabled-color: #b9b9ba;
      --text-overlay: #fff;
      --toast-background: #2d2d2dcc;
      --toast-link: #5ac8fa;
      --tooltip-background: #000c;
      --tw-header-color: #131314;
      --elevated-bg: #ffffffb2;
      --elevated-bg-overlay: #ffffffb2;
      --mira-bg-color: var(--bg-color);
      --mira-blue: #0950cb;
      --pro-accent: #823bf5;
      --pro-accent-secondary: #823bf519;
      --black: #000;
      --blue: #007aff;
      --brown: #a2845e;
      --cyan: #32ade6;
      --green: #34c759;
      --indigo: #5856d6;
      --mint: #00c7be;
      --orange: #ff9500;
      --pink: #ff2d55;
      --purple: #af52de;
      --red: #ff3b30;
      --teal: #30b0c7;
      --white: #fff;
      --yellow: #fc0;
    }
    :root {
      --accent-orange-color: var(--orange);
      --mira-blue-color: var(--mira-blue);
      --mira-pro-accent-color: var(--pro-accent);
      --mira-pro-accent-secondary-color: var(--pro-accent-secondary);
      --primary-fill-bg-color: var(--primary-fill-background);
      --quaternary-fill-bg-color: var(--quaternary-fill-background);
      --tertiary-fill-bg-color: var(--tertiary-fill-background);
      --secondary-fill-bg-color: var(--secondary-fill-background);
      --separator-non-opaque-color: var(--separator-non-opaque);
      --mira-elevated-bg-color: var(--elevated-bg);
      --mira-elevated-bg-overlay-color: var(--elevated-bg-overlay);
      --glass-box-shadow: -.6px -.5px 0 0 #ffffff4d inset, .5px .6px 0 0 #ffffff4d inset, 0 1px 1px 0 #74748005, 0 2px 16px 1px #0000000f;
      --glass-backdrop-filter: blur(15px);
      --safe-area-inset-top: 0px;
      --content-safe-area-inset-top: 0px;
      --sum-inset-top: 0px;
      --safe-area-inset-left: 0px;
      --content-safe-area-inset-left: 0px;
      --sum-inset-left: 0px;
      --safe-area-inset-right: 0px;
      --content-safe-area-inset-right: 0px;
      --sum-inset-right: 0px;
      --safe-area-inset-bottom: 0px;
      --content-safe-area-inset-bottom: 0px;
      --sum-inset-bottom: 0px;
      --secondary-accent-color: rgba(var(--accent-text-color-parts), 10%);
      --accent-text-color: var(--tg-theme-accent-text-color);
      --bg-color: var(--tg-theme-bg-color);
      --bottom-bar-bg-color: var(--tg-theme-bottom-bar-bg-color);
      --button-color: var(--tg-theme-button-color);
      --button-text-color: var(--tg-theme-button-text-color);
      --destructive-text-color: var(--tg-theme-destructive-text-color);
      --header-bg-color: var(--tg-theme-header-bg-color);
      --hint-color: var(--tg-theme-hint-color);
      --link-color: var(--tg-theme-link-color);
      --secondary-bg-color: var(--tg-theme-secondary-bg-color);
      --section-bg-color: var(--tg-theme-section-bg-color);
      --section-header-text-color: var(--tg-theme-section-header-text-color);
      --section-separator-color: var(--tg-theme-section-separator-color);
      --subtitle-text-color: var(--tg-theme-subtitle-text-color);
      --text-color: var(--tg-theme-text-color);
      --app-bg-color: var(--tg-app-bg-color);
      --app-bottom-bar-color: var(--tg-app-bottom-bar-color);
      --app-header-color: var(--tg-app-header-color);
      --tg-theme-section-bg-color: var(--tg-theme-bg-color);
      --tg-theme-accent-text-color: var(--tg-theme-link-color);
      --tg-theme-subtitle-text-color: var(--tg-theme-hint-color);
      --tg-theme-section-header-text-color: var(--tg-theme-hint-color);
      --tg-theme-destructive-text-color: var(--tg-theme-text-destructive-color);
    }

    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: var(--app-bg-color, #f2f2f7);
      color: var(--text-color, #000);
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      min-height: 100vh;
      background-color: #e5e5ea;
      padding-bottom: 20px;
    }
    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }

    /* ================================================================
       НАВИГАЦИОННЫЙ БАР
       ================================================================ */
    .app-nav-bar {
      bottom: 0;
      left: 0;
      position: fixed;
      right: 0;
      z-index: 1000;
      --app-nav-bar-selector-transition-duration: .2s;
      display: flex;
      justify-content: center;
      padding: 8px 16px 16px;
      pointer-events: none;
    }
    .app-nav-bar__panel {
      border-radius: 1000px;
      height: 62px;
      margin: 0 auto;
      max-width: 100%;
      padding: 4px;
      position: relative;
      width: fit-content;
      min-width: 300px;
      pointer-events: auto;
      background-color: var(--section-bg-color, rgba(255, 255, 255, 0.9));
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1), var(--glass-box-shadow);
      transition: transform .2s ease-out;
    }
    .app-nav-bar__panel:active {
      background-color: var(--secondary-bg-color);
      transform: scale(0.97);
    }
    .app-nav-bar__list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      height: 100%;
      justify-content: center;
      border-radius: inherit;
      gap: 0;
    }
    .app-nav-bar__item {
      color: var(--text-color);
      flex: 1 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 0;
      min-width: 82px;
      position: relative;
      z-index: 2;
      padding: 0 8px;
      height: 100%;
      text-decoration: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      border: none;
      background: transparent;
      font-family: inherit;
      border-radius: 1000px;
      transition: color .2s;
    }
    .app-nav-bar__item--active {
      color: var(--link-color, #007aff);
    }
    .app-nav-bar__item-title {
      font-size: 10px;
      line-height: 12px;
      font-weight: 500;
      letter-spacing: 0.2px;
      margin-top: 2px;
    }
    .app-nav-bar__item .icon-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      flex-shrink: 0;
    }
    .app-nav-bar__item svg {
      width: 26px;
      height: 26px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ================================================================
       СЕЛЕКТОР — ШИРОКИЙ (ПОЧТИ НА ВСЮ КНОПКУ)
       ================================================================ */
    .app-nav-bar__selector {
      border-radius: 1000px;
      bottom: 4px;
      left: 4px;
      position: absolute;
      top: 4px;
      transition: transform var(--app-nav-bar-selector-transition-duration) ease-out,
                  width var(--app-nav-bar-selector-transition-duration) ease-out;
      z-index: 0;
      pointer-events: none;
      width: 70px; /* Широкий индикатор */
    }
    .app-nav-bar__selector-inner {
      background: var(--tertiary-fill-background, rgba(118, 118, 128, 0.24));
      border-radius: 1000px;
      height: 100%;
      width: 100%;
      transition: all var(--app-nav-bar-selector-transition-duration) ease-out,
                  transform var(--app-nav-bar-selector-transition-duration) ease-out;
    }
    .app-nav-bar__selector-inner--ios-moving {
      background: transparent;
      box-shadow: var(--glass-box-shadow);
      transform: scale(1.1);
    }
    .app-nav-bar__selector-border {
      border: 1px solid var(--text-color, #000);
      border-radius: inherit;
      height: 100%;
      width: 100%;
      opacity: 0;
      transition: opacity var(--app-nav-bar-selector-transition-duration) ease-out;
    }
    .app-nav-bar__selector-border--ios-moving {
      opacity: .4;
    }

    @media (max-width: 400px) {
      .app-nav-bar__panel {
        min-width: 240px;
      }
      .app-nav-bar__item {
        min-width: 64px;
        padding: 0 4px;
      }
      .app-nav-bar__item-title {
        font-size: 9px;
      }
    }
  </style>
</head>
<body data-platform="ios" data-theme="light">

  <!-- ============================================================
       НАВБАР
       ============================================================ -->
  <nav class="app-nav-bar">
    <div class="app-nav-bar__panel">
      <ul class="app-nav-bar__list">
        <!-- Explore -->
        <li class="app-nav-bar__item app-nav-bar__item--active" data-page="explore">
          <span class="icon-wrap">
            <svg viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="8" />
              <line x1="16.5" y1="16.5" x2="21" y2="21" />
            </svg>
          </span>
          <span class="app-nav-bar__item-title">Explore</span>
        </li>

        <!-- Imagine -->
        <li class="app-nav-bar__item" data-page="imagine">
          <span class="icon-wrap">
            <svg viewBox="0 0 24 24">
              <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" />
            </svg>
          </span>
          <span class="app-nav-bar__item-title">Imagine</span>
        </li>

        <!-- Settings -->
        <li class="app-nav-bar__item" data-page="settings">
          <span class="icon-wrap">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="3" />
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
            </svg>
          </span>
          <span class="app-nav-bar__item-title">Settings</span>
        </li>
      </ul>

      <!-- Широкий селектор -->
      <div class="app-nav-bar__selector" style="transform: translateX(0px); width: 70px;">
        <div class="app-nav-bar__selector-inner">
          <div class="app-nav-bar__selector-border"></div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Подпись -->
  <div style="text-align: center; padding: 24px 20px; background: rgba(255,255,255,0.75); border-radius: 24px; backdrop-filter: blur(12px); box-shadow: 0 8px 40px rgba(0,0,0,0.08); margin: 20px; max-width: 360px; pointer-events: none;">
    <h2 style="margin-bottom: 6px; font-weight: 600; font-size: 20px; color: #1c1c1e;">iOS Nav Bar</h2>
    <p style="color: #666; font-size: 14px; line-height: 1.5;">Широкий индикатор (70px), центрированный под иконкой.<br>Анимация плавная, с эффектом "движения".</p>
    <p style="color: #999; font-size: 12px; margin-top: 12px;">Нажмите на вкладку — индикатор перемещается</p>
  </div>

  <script>
    // ================================================================
    //  ЛОГИКА — ШИРОКИЙ ЦЕНТРИРОВАННЫЙ ИНДИКАТОР
    // ================================================================
    (function() {
      const items = document.querySelectorAll('.app-nav-bar__item');
      const selector = document.querySelector('.app-nav-bar__selector');
      const panel = document.querySelector('.app-nav-bar__panel');

      function updateSelector(activeItem) {
        // Получаем позицию активного элемента
        const itemRect = activeItem.getBoundingClientRect();
        const panelRect = panel.getBoundingClientRect();

        // Вычисляем смещение селектора относительно панели
        const offsetX = itemRect.left - panelRect.left;

        // Ширина селектора — широкая (70px)
        const selectorWidth = 70;

        // Центрируем селектор под иконкой
        const itemCenter = (itemRect.width - selectorWidth) / 2;
        const newLeft = offsetX + itemCenter;

        // Применяем анимацию
        selector.style.transform = `translateX(${newLeft}px)`;
        selector.style.width = selectorWidth + 'px';

        // Обновляем активный класс
        items.forEach(item => item.classList.remove('app-nav-bar__item--active'));
        activeItem.classList.add('app-nav-bar__item--active');

        // Эффект "движения" как в оригинале
        const inner = selector.querySelector('.app-nav-bar__selector-inner');
        const border = selector.querySelector('.app-nav-bar__selector-border');

        if (inner) {
          inner.classList.add('app-nav-bar__selector-inner--ios-moving');
          setTimeout(() => inner.classList.remove('app-nav-bar__selector-inner--ios-moving'), 300);
        }
        if (border) {
          border.classList.add('app-nav-bar__selector-border--ios-moving');
          setTimeout(() => border.classList.remove('app-nav-bar__selector-border--ios-moving'), 300);
        }
      }

      // Обработка кликов
      items.forEach(item => {
        item.addEventListener('click', function(e) {
          e.preventDefault();
          if (this.classList.contains('app-nav-bar__item--active')) return;
          updateSelector(this);
        });
      });

      // Инициализация
      const firstItem = items[0];
      if (firstItem) {
        requestAnimationFrame(() => {
          updateSelector(firstItem);
        });
      }

      // Пересчёт при ресайзе
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          const active = document.querySelector('.app-nav-bar__item--active');
          if (active) updateSelector(active);
        }, 100);
      });

      console.log('iOS Nav Bar — широкий центрированный индикатор!');
    })();
  </script>

</body>
</html>
