<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Домофон</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn {
      display: inline-block;
      padding: 18px 48px;
      font-size: 18px;
      font-weight: 500;
      color: #fff;
      background: #007aff;
      border: none;
      border-radius: 14px;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      box-shadow: 0 4px 14px rgba(0, 122, 255, 0.3);
    }
    .btn:hover {
      background: #0066d6;
    }
    .btn:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>
  <a class="btn" href="hikconnect://liveplay?s=G74084464_1">
    Открыть домофон
  </a>
</body>
