<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>90s</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: black;
            font-family: 'Times New Roman', Times, serif;
            overflow-x: hidden;
            color: white;
        }
        .container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .svg-wrap {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            transition: height 0.05s linear;
            padding: 0 16px;
        }
        .svg-wrap svg {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: black;
        }
        .scroll-down {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #888;
            font-size: 36px;
            pointer-events: none;
            font-family: 'Times New Roman', Times, serif;
            line-height: 1;
        }
        .images-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 16px;
            gap: 20px;
            background: black;
            margin-top: -2px;
        }
        .images-section img {
            width: 100%;
            max-width: 100%;
            height: auto;
            display: block;
            border: none;
            background: black;
        }
        .buttons-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 30px 16px 20px;
            background: black;
        }
        .buttons-section button {
            font-family: 'Times New Roman', Times, serif;
            font-size: 16px;
            background: white;
            color: black;
            border: 1px solid #aaa;
            padding: 6px 28px;
            width: fit-content;
            min-width: 120px;
            letter-spacing: 0.5px;
            cursor: pointer;
            text-transform: lowercase;
        }
        .buttons-section button:active {
            transform: translate(2px, 2px);
        }
        .gh-image {
            width: 100%;
            display: block;
            background: black;
            margin: 0;
            padding: 0;
            line-height: 0;
        }
        .gh-image img {
            width: 100%;
            height: auto;
            display: block;
            border: none;
            margin: 0;
            padding: 0;
        }
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="svg-wrap" id="svgWrap">
        <object data="mara.svg" type="image/svg+xml" style="width:100%; height:100%; display:block; background:black;"></object>
        <div class="scroll-down">▼</div>
    </div>

    <div class="images-section">
        <img src="1.png" alt="">
        <img src="2.png" alt="">
        <img src="3.png" alt="">
    </div>

    <div class="buttons-section">
        <button>кнопка1</button>
        <button>кнопка2</button>
        <button>кнопка3</button>
    </div>

    <div class="gh-image">
        <img src="gh.png" alt="">
    </div>
</div>

<script>
    (function() {
        const wrap = document.getElementById('svgWrap');
        let startHeight = window.innerHeight;
        let prevScroll = window.scrollY;
        let ticking = false;

        function setFullHeight() {
            wrap.style.height = window.innerHeight + 'px';
            startHeight = window.innerHeight;
        }
        setFullHeight();

        function updateHeight() {
            const scrollY = window.scrollY;
            const maxH = window.innerHeight;
            const minH = Math.max(100, window.innerHeight * 0.2);
            let newH = maxH - scrollY;
            if (newH < minH) newH = minH;
            if (newH > maxH) newH = maxH;
            wrap.style.height = newH + 'px';
        }

        window.addEventListener('scroll', function() {
            if (!ticking) {
                window.requestAnimationFrame(function() {
                    updateHeight();
                    ticking = false;
                });
                ticking = true;
            }
        });

        window.addEventListener('resize', function() {
            setFullHeight();
            updateHeight();
        });

        window.addEventListener('load', function() {
            setFullHeight();
            updateHeight();
        });

        window.addEventListener('orientationchange', function() {
            setTimeout(function() {
                setFullHeight();
                updateHeight();
            }, 200);
        });

        setTimeout(function() {
            setFullHeight();
            updateHeight();
        }, 50);
    })();
</script>

</body>
</html>
