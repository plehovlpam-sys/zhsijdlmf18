<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пустая страница</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
        }

        .header-image {
            flex-shrink: 0;
            width: 100%;
            line-height: 0;
            background-color: #ffffff;
        }

        .header-image img {
            display: block;
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        .content {
            flex: 1 0 auto;
            background-color: #ffffff;
        }

        .footer-image {
            flex-shrink: 0;
            width: 100%;
            line-height: 0;
            background-color: #ffffff;
        }

        .footer-image img {
            display: block;
            width: 100%;
            height: auto;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="header-image">
        <img src="/bdufm2/lolprof.png">
    </div>

    <div class="content"></div>

    <div class="footer-image">
        <img src="/bdufm2/shawerma5.png">
    </div>
</body>
</html>
